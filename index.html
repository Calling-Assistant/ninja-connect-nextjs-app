
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Dialing Assistant</title>

    <!-- PWA Manifest and Theme -->
    <meta name="theme-color" content="#5E5DF0" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA/Homescreen Meta Tags -->
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ninja Connect" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        html {
            /* Scale down the entire UI to be more compact and professional */
            font-size: 80%;
        }
        html,
        body {
            overscroll-behavior-y: contain;
            /* Prevent unwanted layout shifts */
            overflow: hidden;
        }
        html, body, #root {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        /* Optimization: Hardware acceleration for all animations */
        .accelerated {
            transform: translateZ(0);
            backface-visibility: hidden;
            perspective: 1000px;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fade-in 0.3s ease-out forwards;
        }
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translate(-50%, 20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.5s ease-out forwards;
        }
        
        @keyframes pulse-ring {
          0% {
            transform: scale(0.95);
            box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
          }
          70% {
            transform: scale(1);
            box-shadow: 0 0 0 20px rgba(255, 255, 255, 0);
          }
          100% {
            transform: scale(0.95);
            box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
          }
        }
        .animate-pulse-ring {
          animation: pulse-ring 2s infinite;
        }

        /* --- Advanced Screensaver Effects --- */
        @keyframes nebula-morph {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            33% { transform: translate(-50%, -52%) rotate(120deg) scale(1.1); border-radius: 60% 40% 30% 70% / 50% 60% 40% 60%; }
            66% { transform: translate(-48%, -48%) rotate(240deg) scale(0.9); border-radius: 30% 60% 70% 40% / 50% 30% 60% 40%; }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
        }
        .animate-nebula-morph-slow {
            animation: nebula-morph 80s ease-in-out infinite;
            will-change: transform, border-radius;
            transform: translateZ(0);
        }
        .animate-nebula-morph-fast {
            animation: nebula-morph 50s ease-in-out infinite reverse;
            will-change: transform, border-radius;
            transform: translateZ(0);
        }

        @keyframes star-twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8) translate3d(0,0,0); }
            50% { opacity: 1; transform: scale(1.2) translate3d(0,0,0); }
        }
        .animate-star-twinkle {
            animation: star-twinkle var(--twinkle-duration) ease-in-out infinite;
            animation-delay: var(--twinkle-delay);
            will-change: opacity, transform;
        }

        /* --- Spiral breathing animations --- */
        @keyframes rotate-slow {
            from { transform: rotate(0deg) translateZ(0); }
            to { transform: rotate(360deg) translateZ(0); }
        }
        .animate-rotate-slow {
            animation: rotate-slow 120s linear infinite;
        }

        @keyframes dot-breathe {
            0%, 100% { opacity: 0.2; transform: scale(0.85) translateZ(0); }
            50% { opacity: 0.65; transform: scale(1.15) translateZ(0); }
        }
        .animate-dot-breathe {
            animation: dot-breathe 8s ease-in-out infinite;
            will-change: opacity, transform;
        }

        /* --- Charging Effects --- */
        @keyframes liquid-wave {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .animate-liquid-wave {
            animation: liquid-wave 5s linear infinite;
            will-change: transform;
            transform: translateZ(0);
        }
        
        @keyframes charging-particle {
            0% { transform: translate3d(0, 0, 0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate3d(var(--x-offset), -100vh, 0); opacity: 0; }
        }
        .animate-charging-particle {
            animation: charging-particle var(--duration) ease-in infinite;
            animation-delay: var(--delay);
            will-change: transform, opacity;
        }

        /* --- Glass UI Styles --- */
        .glass main,
        .glass .bg-slate-100.dark\\:bg-slate-900 {
            background-color: transparent !important;
        }
        .glass header {
            background: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15) !important;
        }
        .glass.dark header {
             background: rgba(26, 32, 44, 0.3) !important;
        }
        .glass .bg-white.dark\\:bg-slate-800 {
            background-color: rgba(255, 255, 255, 0.15) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
        }
        .glass.dark .bg-white.dark\\:bg-slate-800 {
            background-color: rgba(45, 55, 72, 0.25) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        .glass nav.flex { 
            background-color: rgba(255, 255, 255, 0.15) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.2) !important;
        }
        .glass.dark nav.flex {
            background-color: rgba(45, 55, 72, 0.25) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        .glass .bg-black\\/50 {
            background-color: rgba(0,0,0,0.3) !important;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Optimization: content-visibility for sections that aren't always active */
        section {
            content-visibility: auto;
            contain-intrinsic-size: 1px 500px;
        }
        
    </style>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<link rel="stylesheet" href="/index.css">
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
